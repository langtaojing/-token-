<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Team Hub · 朋友试用</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="trial-wrap"><section id="login" class="trial-card"><h1>AI Team Hub</h1><p class="trial-muted">朋友试用入口。请使用你收到的账号登录。</p><label>用户名</label><input id="username" autocomplete="username"><label>密码</label><input id="password" type="password" autocomplete="current-password"><button id="login-btn" class="trial-btn">登录</button><p id="login-msg" class="trial-error"></p></section><main id="workspace" class="trial-card trial-hidden"><header class="trial-head"><div><div class="trial-eyebrow">AI TEAM HUB / PRIVATE TRIAL</div><h1>AI 工作台</h1><p id="identity" class="trial-muted"></p></div><button id="logout-btn" class="trial-btn secondary">退出登录</button></header><div class="trial-usage" id="usage"></div><label>输入问题</label><textarea id="prompt" placeholder="输入你想让 MiniMax 处理的问题"></textarea><button id="send-btn" class="trial-btn">发送请求</button><div id="result" class="trial-result">等待输入……</div></main></div><script>
const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'请求失败');return d}async function refresh(){try{const d=await api('/api/me');$('login').classList.add('trial-hidden');$('workspace').classList.remove('trial-hidden');$('identity').textContent='已登录：'+d.username+' · '+(d.role==='admin'?'管理员':'试用成员');$('usage').textContent='今日额度：'+d.requests_used+'/'+d.daily_requests+' 次请求，'+d.tokens_used+'/'+d.daily_tokens+' Token'}catch{}}$('login-btn').onclick=async()=>{try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});$('login-msg').textContent='';await refresh()}catch(e){$('login-msg').textContent=e.message}};$('logout-btn').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('send-btn').onclick=async()=>{const p=$('prompt').value.trim();if(!p)return;$('send-btn').disabled=true;$('result').textContent='请求中…';try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({prompt:p})});$('result').textContent='【'+d.model+' · 实时响应】

'+d.answer;await refresh()}catch(e){$('result').textContent='请求失败：'+e.message}finally{$('send-btn').disabled=false}};refresh();
</script></body></html>
