<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Team Hub · 朋友试用</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="trial-wrap"><section id="login" class="trial-card"><h1>AI Team Hub</h1><p class="trial-muted">朋友试用入口。登录或创建账号。</p><div class="trial-tabs"><button id="show-login" class="trial-tab active">登录</button><button id="show-register" class="trial-tab">注册</button></div><div id="login-form"><label>用户名</label><input id="username" autocomplete="username"><label>密码</label><input id="password" type="password" autocomplete="current-password"><button id="login-btn" class="trial-btn">登录</button><p id="login-msg" class="trial-error"></p></div><div id="register-form" class="trial-hidden"><label>用户名</label><input id="reg-username" autocomplete="username"><label>密码</label><input id="reg-password" type="password" autocomplete="new-password"><label>确认密码</label><input id="reg-repeat" type="password" autocomplete="new-password"><p class="trial-muted">账号和密码由你自己定义；请使用容易管理但不要与其他服务重复的密码。</p><button id="register-btn" class="trial-btn">创建账号</button><p id="register-msg" class="trial-error"></p></div></section><main id="workspace" class="trial-card trial-hidden"><header class="trial-head"><div><div class="trial-eyebrow">AI TEAM HUB / PRIVATE TRIAL</div><h1>AI 工作台</h1><p id="identity" class="trial-muted"></p></div><button id="logout-btn" class="trial-btn secondary">退出登录</button></header><div class="trial-usage" id="usage"></div><label>输入问题</label><textarea id="prompt" placeholder="输入你想让 MiniMax 处理的问题"></textarea><button id="send-btn" class="trial-btn">发送请求</button><div id="result" class="trial-result">等待输入……</div><section id="admin-panel" class="trial-admin trial-hidden"><h2>管理员账号管理</h2><div id="admin-users"></div></section></main></div><script src="/trial.js" defer></script></body></html>
