<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AI Team Hub"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/ai-team-hub-icon.png"><title>AI Team Hub · 朋友试用</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="trial-wrap"><section id="login" class="trial-card"><h1>AI Team Hub</h1><p class="trial-muted">手机和电脑共用的 AI 工作台。登录或创建账号。</p><div class="trial-tabs"><button id="show-login" class="trial-tab active">已有账号</button><button id="show-register" class="trial-tab">创建账号</button></div><div id="login-form"><label>用户名</label><input id="username" autocomplete="username"><label>密码</label><input id="password" type="password" autocomplete="current-password"><button id="login-btn" class="trial-btn">登录</button><p id="login-msg" class="trial-error"></p></div><div id="register-form" class="trial-hidden"><label>用户名</label><input id="reg-username" autocomplete="username"><label>密码</label><input id="reg-password" type="password" autocomplete="new-password"><label>确认密码</label><input id="reg-repeat" type="password" autocomplete="new-password"><p class="trial-muted">账号和密码由你自己定义；请使用容易管理但不要与其他服务重复的密码。</p><button id="register-btn" class="trial-btn">创建账号</button><p id="register-msg" class="trial-error"></p></div></section><main id="workspace" class="trial-card trial-hidden"><header class="trial-head"><div><div class="trial-eyebrow">AI TEAM HUB / WORKSPACE</div><h1>AI 工作台</h1><p id="identity" class="trial-muted"></p></div><button id="logout-btn" class="trial-btn secondary">退出登录</button></header><div class="trial-usage" id="usage"></div><section class="plans-panel"><h2>订购套餐</h2><p class="trial-muted">当前为人工审核申请，尚未接入在线支付；提交申请不会扣费。</p><div id="plan-list" class="plans-grid"></div><p id="plan-message" class="trial-muted"></p></section><p id="install-hint" class="trial-muted">手机可在浏览器菜单中选择“添加到主屏幕”，下次像应用一样打开。</p>
<section class="client-tools"><div><h2>快速任务</h2><select id="template-select"><option value="">选择一个任务模板</option><option value="总结并提炼">总结并提炼</option><option value="生成行动计划">生成行动计划</option><option value="检查风险和遗漏">检查风险和遗漏</option></select></div><div><h2>我的文件</h2><input id="file-input" type="file" accept=".pdf,.docx,.txt,.md,.mp4,.mov,.mp3,.wav"><button id="upload-btn" class="trial-btn secondary">上传文件</button><div id="file-list" class="file-list"></div></div></section>
<label>输入问题</label><textarea id="prompt" placeholder="输入你想让 MiniMax 处理的问题"></textarea><button id="send-btn" class="trial-btn">发送请求</button><div id="result" class="trial-result">等待输入……</div><section id="admin-panel" class="trial-admin trial-hidden"><h2>后台监测</h2><p class="trial-muted">延迟包含规划、执行、复查三个 MiniMax 阶段；P95 在样本少时等于最慢样本。</p><div id="admin-metrics" class="metrics-grid">正在加载…</div><h2>用户用量</h2><div id="admin-usage"></div><h2>套餐申请</h2><div id="admin-orders"></div><h2>管理员账号管理</h2><div id="admin-users"></div></section></main></div><script src="/trial.js" defer></script></body></html>
