<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 模型运营工作台</title>
  <style>
    :root { font-family: Segoe UI, Microsoft YaHei, sans-serif; color: #eef3ff; background: #0b1020; }
    * { box-sizing: border-box; } body { margin: 0; }
    .app { display: grid; grid-template-columns: 225px 1fr; min-height: 100vh; }
    aside { padding: 24px 16px; background: #0d1527; border-right: 1px solid #30415f; }
    .brand { font-size: 18px; font-weight: bold; margin-bottom: 30px; }
    nav div { padding: 12px; color: #9eabc4; border-radius: 8px; } nav .active { background: #1c2942; color: #fff; }
    .note { margin-top: 40px; border: 1px solid #30415f; border-radius: 10px; padding: 12px; color: #9eabc4; font-size: 12px; line-height: 1.6; }
    main { padding: 30px; max-width: 1300px; width: 100%; margin: auto; }
    header { display: flex; justify-content: space-between; margin-bottom: 24px; } h1 { margin: 0 0 8px; font-size: 28px; } h2 { font-size: 16px; margin-top: 0; }
    .muted, label { color: #9eabc4; } .muted { font-size: 13px; } label { display: block; margin: 15px 0 7px; font-size: 12px; }
    .tag { color: #60d6a8; background: #17362d; padding: 8px 12px; height: max-content; border-radius: 100px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(310px, .8fr); gap: 18px; }
    .card { background: #17243c; border: 1px solid #30415f; border-radius: 15px; padding: 20px; }
    select, textarea { width: 100%; background: #0d1628; color: #eef3ff; border: 1px solid #405372; border-radius: 9px; padding: 11px; font: inherit; }
    textarea { min-height: 140px; resize: vertical; } .row { display: flex; gap: 10px; } .row select { flex: 1; }
    button { border: 0; border-radius: 9px; padding: 11px 15px; background: #86b8ff; color: #081224; font-weight: bold; cursor: pointer; }
    button.secondary { background: #293a59; color: #eef3ff; } button:disabled { opacity: .5; }
    #result { white-space: pre-wrap; margin-top: 16px; min-height: 120px; padding: 14px; background: #0c1629; border: 1px solid #3a5070; border-radius: 10px; line-height: 1.6; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; } .metric { background: #101b2f; border: 1px solid #30415f; border-radius: 10px; padding: 12px; }
    .metric span { display: block; color: #9eabc4; font-size: 11px; } .metric strong { display: block; margin-top: 7px; font-size: 20px; }
    .model { display: flex; justify-content: space-between; border-bottom: 1px solid #2a3955; padding: 13px 0; font-size: 13px; }
    .pill { color: #60d6a8; } .warn { color: #ffc478; } .full { margin-top: 18px; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; } th, td { text-align: left; padding: 11px 7px; border-bottom: 1px solid #2a3955; } th { color: #9eabc4; font-weight: normal; }
    @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { display: none; } main { padding: 20px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <aside><div class="brand">✦ AI 模型运营工作台</div><nav><div class="active">模型对话</div><div>调用记录</div><div>成本统计</div><div>模型配置</div></nav><div class="note">第一版演示。直接打开即可体验流程；当前使用模拟响应。</div></aside>
  <main>
    <header><div><h1>模型对话</h1><div class="muted">统一调用模型，记录用量，在主模型异常时切换备用模型。</div></div><span class="tag">● 演示环境</span></header>
    <div class="grid">
      <section class="card"><h2>发起一次调用</h2><label for="model">选择模型</label><div class="row"><select id="model"><option value="MiniMax-M3">MiniMax-M3 · 主模型</option><option value="GPT-5.6-Sol">GPT-5.6-Sol · 备用模型</option><option value="DeepSeek-V3">DeepSeek-V3 · 备用模型</option></select><button class="secondary" id="fail">模拟主模型故障</button></div><label for="prompt">输入问题</label><textarea id="prompt" placeholder="例如：帮我把产品需求整理成用户故事"></textarea><div class="row" style="margin-top:12px"><button id="send">发送请求</button><button class="secondary" id="clear">清空</button></div><div id="result">等待输入问题……</div><p class="muted">点击“模拟主模型故障”，可以体验备用模型切换。</p></section>
      <section class="card"><h2>本次演示概览</h2><div class="metrics"><div class="metric"><span>调用次数</span><strong id="calls">0</strong></div><div class="metric"><span>Token 估算</span><strong id="tokens">0</strong></div><div class="metric"><span>费用估算</span><strong id="cost">¥0.00</strong></div></div><h2 style="margin-top:24px">模型状态</h2><div class="model">MiniMax-M3 <span class="pill" id="state">模拟就绪</span></div><div class="model">GPT-5.6-Sol <span class="pill">备用就绪</span></div><div class="model">DeepSeek-V3 <span class="pill">备用就绪</span></div></section>
    </div>
    <section class="card full"><h2>最近调用记录</h2><table><thead><tr><th>时间</th><th>模型</th><th>请求摘要</th><th>Token</th><th>状态</th></tr></thead><tbody id="history"><tr id="empty"><td colspan="5" class="muted">还没有调用记录</td></tr></tbody></table></section>
  </main>
</div>
<script>
  const el = id => document.getElementById(id); let down = false, total = 0, count = 0;
  el('fail').onclick = () => { down = !down; el('fail').textContent = down ? '恢复主模型' : '模拟主模型故障'; el('state').textContent = down ? '模拟故障' : '模拟就绪'; el('state').className = down ? 'warn' : 'pill'; };
  el('clear').onclick = () => { el('prompt').value = ''; el('result').textContent = '等待输入问题……'; };
  el('send').onclick = () => {
    const prompt = el('prompt').value.trim(); if (!prompt) { el('result').textContent = '请先输入问题。'; return; }
    const chosen = el('model').value, actual = chosen === 'MiniMax-M3' && down ? 'GPT-5.6-Sol' : chosen;
    el('send').disabled = true; el('send').textContent = '调用中…'; el('result').textContent = '正在调用 ' + actual + '（模拟）…';
    setTimeout(() => {
      const tokens = Math.max(90, Math.round(prompt.length * 4.2)); count++; total += tokens;
      el('result').textContent = '【' + actual + ' · 模拟响应】\n\n已收到你的问题：\n' + prompt + '\n\n第一版已展示模型选择、备用切换、调用记录和用量面板。';
      el('calls').textContent = count; el('tokens').textContent = total.toLocaleString(); el('cost').textContent = '¥' + (total * .00025).toFixed(2); el('empty')?.remove();
      const row = document.createElement('tr'); [new Date().toLocaleTimeString('zh-CN', {hour12:false}), actual, prompt.slice(0,25), '≈ ' + tokens, '模拟成功'].forEach(value => { const cell = document.createElement('td'); cell.textContent = value; row.append(cell); }); el('history').prepend(row);
      el('send').disabled = false; el('send').textContent = '发送请求';
    }, 600);
  };
</script>
</body></html>
